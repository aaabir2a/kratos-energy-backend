# Host nginx (NOT the container) — reverse proxy for the backend API.
# Drop into /etc/nginx/sites-available/ and symlink into sites-enabled/.
# Only affects the api.kratos-energy.com vhost — other projects untouched.
# certbot --nginx will add the 443 server + redirect automatically.
server {
    listen 80;
    listen [::]:80;
    server_name api.kratos-energy.com;

    client_max_body_size 30M;   # image uploads

    # ── MinIO objects served over the API domain (HTTPS) ──
    # Image URLs are built from MINIO_PUBLIC_BASE_URL as <base>/<bucket>/<key>,
    # so each public bucket needs its own location. Without these the paths fall
    # through to Express and return {"code":"NOT_FOUND"}.
    #   kratos-uploads → hero/*, catalog/*, projects/*
    #   blogs          → blog post images (MINIO_BLOGS_BUCKET)
    location /kratos-uploads/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /blogs/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;   # API_PORT from docker compose .env
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
